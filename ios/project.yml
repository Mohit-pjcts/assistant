# The iPhone app's Xcode project, generated by XcodeGen (`brew install xcodegen`,
# then `xcodegen generate` in this directory). The .xcodeproj is NOT committed:
# this file is the source of truth, so the project stays reviewable text.
# PLAN.md Phase 30.
name: Oni
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
packages:
  OniCore:
    path: OniCore
targets:
  Oni:
    type: application
    platform: iOS
    sources:
      - path: Oni
    dependencies:
      - package: OniCore
        product: OniCore
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Oni
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
schemes:
  Oni:
    build:
      targets:
        Oni: all
    run:
      config: Debug
